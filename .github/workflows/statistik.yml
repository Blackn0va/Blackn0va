# Zählt einmal am Tag Commits und Projekte – öffentliche und private – und aktualisiert die Karten
# im Profil. Ändert sich keine Zahl, entsteht kein Commit.
#
# Einrichtung (einmalig, von Hand):
#   1. Fine-grained Token anlegen: https://github.com/settings/personal-access-tokens/new
#      Resource owner: Blackn0va · Repository access: All repositories
#      Permissions: Contents → Read-only, Metadata → Read-only
#   2. Als Secret STATS_TOKEN in diesem Repository hinterlegen.
#   3. Repositories, die nicht mitzählen sollen, als Secret STATS_EXCLUDE_REPOS (Kommaliste).
#      Bewusst ein Secret und keine Variable: Die Namen können private Repositories nennen,
#      und die Actions-Protokolle dieses Repositories sind öffentlich.
#
# Fehlt das Token oder sieht es keine privaten Repositories, bricht das Skript ab, ohne etwas zu
# schreiben (fail-closed). Das Profil zeigt dann weiter den letzten guten Stand.
name: Statistik

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statistik
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Blackn0va/Blackn0va'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zahlen erheben und Karten erzeugen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_EXCLUDE_REPOS: ${{ secrets.STATS_EXCLUDE_REPOS }}
        run: ./scripts/Statistik-aktualisieren.ps1

      - name: Änderungen committen
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          git commit -m 'chore: Statistik aktualisieren'
          git push
