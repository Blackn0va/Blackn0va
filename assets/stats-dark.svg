<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-labelledby="t d">
  <title id="t">GitHub in Zahlen</title>
  <desc id="d">GitHub in Zahlen: 2.300 Commits, davon 1.785 im Jahr 2026; 20 Projekte, davon 10 privat; auf GitHub seit 2015.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
    .sub { font-size: 12px; fill: #9198a1; }
    .hero { font-size: 48px; font-weight: 600; fill: #f0f6fc; letter-spacing: -1px; }
    .val { font-size: 22px; font-weight: 600; fill: #f0f6fc; }
    .lab { font-size: 12.5px; fill: #9198a1; }
    .note { font-size: 11px; fill: #848d97; }
  </style>
  <rect x="0.5" y="0.5" width="399" height="239" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="20" y="32" class="h">GitHub in Zahlen</text>
  <text x="20" y="51" class="sub">öffentliche und private Repositories · Stand 23.11.2026</text>

  <text x="18" y="112" class="hero">2.300</text>
  <text x="20" y="134" class="lab">Commits gesamt</text>

  <line x1="20" y1="160.5" x2="380" y2="160.5" stroke="#30363d"/>
  <text x="20" y="192" class="val">1.785</text>
  <text x="20" y="212" class="lab">Commits 2026</text>
  <text x="145" y="192" class="val">20</text>
  <text x="145" y="212" class="lab">Projekte</text>
  <text x="145" y="228" class="note">10 davon privat</text>
  <text x="270" y="192" class="val">11</text>
  <text x="270" y="212" class="lab">Jahre auf GitHub</text>
  <text x="270" y="228" class="note">seit 2015</text>
</svg>
