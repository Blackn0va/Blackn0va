  <circle cx="25" cy="109.5" r="5" fill="#2a78d6"/>
  <text x="38" y="114" class="name">C++</text>
  <text x="190" y="114" class="share" text-anchor="end">38,1 %</text>
  <circle cx="215" cy="109.5" r="5" fill="#eb6834"/>
  <text x="228" y="114" class="name">Java</text>
  <text x="380" y="114" class="share" text-anchor="end">30,1 %</text>
  <circle cx="25" cy="141.5" r="5" fill="#6250d6"/>
  <text x="38" y="146" class="name">PHP</text>
  <text x="190" y="146" class="share" text-anchor="end">21,0 %</text>
  <circle cx="215" cy="141.5" r="5" fill="#008300"/>
  <text x="228" y="146" class="name">Python</text>
  <text x="380" y="146" class="share" text-anchor="end">2,8 %</text>
  <circle cx="25" cy="173.5" r="5" fill="#e87ba4"/>
  <text x="38" y="178" class="name">PowerShell</text>
  <text x="190" y="178" class="share" text-anchor="end">2,5 %</text>
