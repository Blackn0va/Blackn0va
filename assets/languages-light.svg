    .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .sub { font-size: 12px; fill: #59636e; }
    .name { font-size: 13px; fill: #1f2328; }
    .share { font-size: 13px; fill: #59636e; }
    .note { font-size: 11px; fill: #656d76; }
  </style>
  <defs>
    <clipPath id="bar"><rect x="20" y="70" width="360" height="8" rx="4"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="239" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="20" y="32" class="h">Sprachen</text>
  <text x="20" y="51" class="sub">nach Codeumfang in 23 Projekten</text>
  <g clip-path="url(#bar)">
    <rect x="20" y="70" width="133.35" height="8" fill="#2a78d6"><title>C++: 38,1 %</title></rect>
    <rect x="155.35" y="70" width="105.35" height="8" fill="#eb6834"><title>Java: 30,1 %</title></rect>
    <rect x="262.7" y="70" width="73.5" height="8" fill="#6250d6"><title>PHP: 21,0 %</title></rect>
    <rect x="338.2" y="70" width="9.8" height="8" fill="#008300"><title>Python: 2,8 %</title></rect>
    <rect x="350" y="70" width="8.75" height="8" fill="#e87ba4"><title>PowerShell: 2,5 %</title></rect>
    <rect x="360.75" y="70" width="19.25" height="8" fill="#8c959f"><title>Sonstige: 5,5 %</title></rect>
